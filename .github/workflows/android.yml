
name: Build GaleryCamNew APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -o *.zip -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle -p extracted/GaleryCamNew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GaleryCamNew-APK
          path: extracted/GaleryCamNew/app/build/outputs/apk/debug/app-debug.apk
